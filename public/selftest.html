<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>自己テスト｜アップロード不要の動画圧縮</title>
<link rel="icon" href="./icons/icon-192.png" sizes="192x192">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">
<!-- 開発者向け：この端末で、テスト用の動画を作って実際に圧縮し、結果を確かめるページ（どこからもリンクしない） -->
<style>
  :root {
    color-scheme: light dark;
    --bg: #f2f2f7;
    --surface: #ffffff;
    --text: #12141a;
    --muted: #636779;
    --line: #d9dae3;
    --accent: #007aff;
    --on-accent: #ffffff;
    --ok: #1b7f3b;
    --ng: #c62828;
    --warn: #9a5b00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0d12;
      --surface: #171a22;
      --text: #f2f3f7;
      --muted: #9ba0b4;
      --line: #2e3446;
      --accent: #0a84ff;
      --ok: #4cc26e;
      --ng: #ff6b6b;
      --warn: #ffb44d;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.5;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 16px 16px calc(32px + env(safe-area-inset-bottom));
  }
  h1 { font-size: 20px; margin: 4px 0 4px; }
  h2 { font-size: 16px; margin: 20px 0 8px; }
  .muted { color: var(--muted); font-size: 13px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px;
    margin: 12px 0;
  }
  .btn {
    display: block;
    width: 100%;
    border: 0;
    border-radius: 10px;
    padding: 12px;
    margin: 8px 0;
    font: inherit;
    font-weight: 600;
    background: var(--accent);
    color: var(--on-accent);
  }
  .btn.sub { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  .btn:disabled { opacity: .45; }
  #status { font-weight: 600; min-height: 1.5em; }
  #notice {
    border: 2px solid var(--accent);
    border-radius: 12px;
    padding: 12px;
    font-weight: 600;
  }
  .hidden { display: none !important; }
  ol#results { list-style: none; padding: 0; margin: 0; }
  ol#results li { padding: 8px 0; border-top: 1px solid var(--line); }
  ol#results li:first-child { border-top: 0; }
  .mark { display: inline-block; width: 1.4em; font-weight: 700; }
  .ok .mark { color: var(--ok); }
  .ng .mark { color: var(--ng); }
  .warn .mark { color: var(--warn); }
  .run .mark, .wait .mark { color: var(--muted); }
  .detail { color: var(--muted); font-size: 13px; padding-left: 1.4em; word-break: break-all; }
  #summary { font-weight: 700; }
  iframe {
    display: block;
    width: 100%;
    height: 420px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
  }
  details summary { cursor: pointer; color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>自己テスト</h1>
  <p class="muted">この端末で、テスト用の動画をその場で作り、実際に圧縮して結果を確かめます。動画はどこにも送られません。保存してある設定も変わりません。</p>
  <p class="muted" id="device"></p>

  <div class="card">
    <button id="autoBtn" type="button" class="btn">自動テストを始める</button>
    <button id="switchBtn" type="button" class="btn sub">別のアプリへの切り替えを試す</button>
    <button id="fileBtn" type="button" class="btn sub">手元の動画でも試す</button>
    <input id="file" type="file" accept="video/*" class="hidden">
    <p id="status"></p>
    <p id="notice" class="hidden"></p>
  </div>

  <div class="card">
    <p id="summary">まだ実行していません</p>
    <ol id="results"></ol>
    <button id="copyBtn" type="button" class="btn sub" disabled>結果をコピー</button>
  </div>

  <details id="appBox" open>
    <summary>アプリの画面（テスト中に動かしている画面）</summary>
    <iframe id="app" title="テスト中のアプリの画面"></iframe>
  </details>
</main>
<script src="./vendor/mediabunny.min.js"></script>
<script src="./selftest.js"></script>
</body>
</html>
